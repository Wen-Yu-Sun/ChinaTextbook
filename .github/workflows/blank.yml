name: 压缩“高中”文件夹

on:
  push:
    branches: [ main, master, ALL ]   # 当推送到main或master分支时触发
  workflow_dispatch:             # 支持手动触发

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查“高中”文件夹是否存在
        id: check
        run: |
          if [ -d "高中" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: 压缩文件夹
        if: steps.check.outputs.exists == 'true'
        run: |
          zip -r 高中.zip 高中/
      - name: 上传压缩包作为 Artifact
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 高中压缩包
          path: 高中.zip
          retention-days: 7      # 保留7天，可根据需要修改
